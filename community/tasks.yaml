# Shared RSI Community — Official Task & Bounty Registry
# Publishers add new tasks via Pull Request to this file.
# The Automated Community Agent (rsi_community_steward) syncs this file with:
#   1. Tracking Issues in Prism-Shadow/penguin-harness-community
#   2. Linked Issues & PR status in target repositories (penguin-harness, penguin-harness-benchmark, penguin-harness-plugins)
#   3. Real-time status & Monthly Growth EXP leaderboard on the community website

version: 1
policy:
  max_concurrent_claims_per_user: 2
  claim_stale_timeout_days: 14
  monthly_budget_usd: 2000
  budget_breakdown:
    proportional_exp_pool_usd: 1100
    top_leaderboard_bonus_usd: 500
    committee_stipend_pool_usd: 400
    committee_per_member_usd: 100
  claim_command_template: "/claim {task_id}"
  submit_command_template: "/submit {task_id} {pr_url}"

