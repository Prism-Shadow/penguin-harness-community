<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 172" width="1000" height="172" font-family="Arial, Noto Sans CJK SC, sans-serif"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#9ca3af"/></marker><marker id="loop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#b45309"/></marker></defs><text x="16" y="25" fill="#111827" font-size="18" font-weight="600">Three runs repeat the same algorithm until timeout</text><rect x="16" y="52" width="180" height="64" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/><text x="106.0" y="90" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="500">Greedy + local search</text><path d="M196 84 H224" fill="none" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="232" y="52" width="218" height="64" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/><text x="341.0" y="78" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="500">Small tests pass</text><text x="341.0" y="101" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="500">Large-test cost exceeds cap</text><path d="M450 84 H482" fill="none" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="490" y="52" width="218" height="64" rx="6" fill="#fef3c7" fill-opacity="0.65" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3"/><text x="599.0" y="78" text-anchor="middle" fill="#78350f" font-size="16" font-weight="500">Tune the same algorithm</text><text x="599.0" y="101" text-anchor="middle" fill="#78350f" font-size="16" font-weight="500">30+ minutes</text><path d="M708 84 H740" fill="none" stroke="#9ca3af" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="748" y="52" width="236" height="64" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/><text x="866.0" y="78" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="600">40-minute timeo