<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <!-- Series A, use-bento-slides: a bento grid of five white slide tiles (one large, one wide,
       three small), each holding one piece of line content in the deep ink and light accent. -->
  <defs>
    <clipPath id="bs-frame"><rect x="112" y="92" width="416" height="210" rx="10" /></clipPath>
  </defs>

  <!-- large: title bar over an image frame -->
  <rect class="paper card" x="80" y="20" width="480" height="313" rx="16" />
  <rect class="ink" x="112" y="50" width="190" height="16" rx="8" />
  <rect class="acc" x="112" y="92" width="416" height="210" rx="10" />
  <g clip-path="url(#bs-frame)">
    <path class="ink-ln" d="M136 280L222 200 290 258 346 214 452 290" />
  </g>
  <circle cx="462" cy="146" r="20" style="fill: #fff; stroke: var(--ink); stroke-width: 3" />

  <!-- wide: bullet lines -->
  <rect class="paper card" x="80" y="354" width="480" height="146" rx="16" />
  <circle class="ink" cx="118" cy="388" r="6" />
  <path class="ink-ln" d="M140 388h300" />
  <circle class="ink" cx="118" cy="427" r="6" />
  <path class="ink-ln" d="M140 427h370" />
  <circle class="ink" cx="118" cy="466" r="6" />
  <path class="ink-ln" d="M140 466h230" />

  <!-- small 1: a pie with a two-line legend -->
  <rect class="paper card" x="582" y="20" width="238" height="146" rx="16" />
  <circle class="acc" cx="652" cy="93" r="44" />
  <path class="ink" d="M652 93V49A44 44 0 0 1 690.1 115Z" />
  <circle class="ink" cx="726" cy="78" r="6" />
  <path class="ink-ln" d="M742 78h50" />
  <circle class="acc" cx="726" cy="108" r="6" />
  <path class="ink-ln" d="M742 108h36" />

  <!-- small 2: a bar chart -->
  <rect class="paper card" x="582" y="187" width="238" height="146" rx="16" />
  <rect class="acc" x="620" y="258" width="28" height="44" rx="4" />
  <rect class="acc" x="662" y="232" width="28" height="70" rx="4" />
  <rect class="acc" x="704" y="246" width="28" height="56" rx="4" />
  <rect class="ink" x="746" y="214" width="28" height="88" rx="4" />
  <path class="ink-ln" d="M608 304H786" />

  <!-- small 3: a title slide -->
  <rect class="paper card" x="582" y="354" width="238" height="146" rx="16" />
  <rect class="ink" x="641" y="408" width="120" height="16" rx="8" />
  <rect class="acc" x="666" y="440" width="70" height="8" rx="4" />
</svg>
