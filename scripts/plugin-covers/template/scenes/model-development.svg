<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <!-- Series A, model-development: a rack of your own machines, joined by a dashed line to a
       card with a falling training curve. -->

  <!-- the rack: three units, two lights and two vents each -->
  <g class="ln f12">
    <rect x="40" y="80" width="320" height="100" rx="16" />
    <rect x="40" y="200" width="320" height="100" rx="16" />
    <rect x="40" y="320" width="320" height="100" rx="16" />
  </g>
  <g class="lt">
    <circle cx="84" cy="130" r="9" />
    <circle cx="114" cy="130" r="9" />
    <circle cx="84" cy="250" r="9" />
    <circle cx="114" cy="250" r="9" />
    <circle cx="84" cy="370" r="9" />
    <circle cx="114" cy="370" r="9" />
  </g>
  <path class="ln" d="M200 116h120M200 144h120M200 236h120M200 264h120M200 356h120M200 384h120" />

  <!-- dashed link -->
  <path class="ln dash" d="M360 250H470" />

  <!-- the curve card -->
  <rect class="paper card" x="470" y="70" width="390" height="360" rx="18" />
  <path class="acc-ln" d="M514 180H820M514 260H820" style="stroke-dasharray: 2 12" />
  <path class="ink-ln" d="M514 110V380H820" />
  <path class="ink-ln" d="M530 130C580 280 650 320 806 340" style="stroke-width: 6px" />
  <circle class="acc" cx="806" cy="340" r="14" />
  <circle class="ink" cx="806" cy="340" r="6" />
</svg>
