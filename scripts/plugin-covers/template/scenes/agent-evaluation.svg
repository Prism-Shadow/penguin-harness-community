  <rect class="acc" x="74" y="112" width="44" height="44" rx="11" />
  <path class="ink-ln" d="M84 134l9 9 16-17" />
  <path class="ink-ln" d="M142 124h200" />
  <rect class="acc" x="142" y="140" width="120" height="8" rx="4" />

  <rect class="acc" x="74" y="228" width="44" height="44" rx="11" />
  <path class="ink-ln" d="M84 250l9 9 16-17" />
  <path class="ink-ln" d="M142 240h176" />
  <rect class="acc" x="142" y="256" width="140" height="8" rx="4" />

