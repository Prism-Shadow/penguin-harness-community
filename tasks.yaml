2. 对比候选商品的销量、库存和单位毛利。输入促销价后，展示同一商品促销前后的单位毛利与毛利率，并注明计算口径。
3. 用固定样表和预期结果核对计算，至少交付一份选品或促销分析报告。报告中的建议能追溯到对应指标和原始商品行。
