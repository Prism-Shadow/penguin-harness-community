    target_repository: "https://github.com/Prism-Shadow/penguin-harness"
    related_issue: null
    title: "Design and Implement Standardized RSI Protocol (RSI Simple APIs: Sampling, Evaluation & Update Primitives)"
    title_zh: "设计并实现标准化 RSI 协议与轻量原语接口（RSI Simple APIs：采样、评估与状态更新）"
    description: "Design and implement \"RSI Simple APIs\" in PenguinHarness — a clean, standardized protocol and SDK that decouples RSI search/evolution algorithms from underlying agent harnesses, benchmarks, and mutable agent states.

Deliverables and acceptance criteria:
1. Define a minimal, composable protocol specification and TypeScript/Python SDK for RSI Simple APIs built around core primitives:
   - `sample(state, task, n, config)`: run parallel agent rollouts or generate candidate mutations (prompts, skills, memory playbooks, harness code, or model weights) from a versioned parent state node.
   - `evaluate(candidate, benchmark_contract)`: execute isolated benchmark evaluators and anti-reward-hacking reviewers, returning standardized scalar scores, noise margins, execution traces, and failure diagnostics.
   - `update(candidate_tree, feedback, strategy)`: commit verified improvements to the versioned candidate tree and experience bank, updating the active agent state.
2. Demonstrate plug-and-play interoperability by expressing at least two distinct RSI algorithms (e.g., ACE / OPRO / Reflexion / ERNIE Evolve style lane search) cleanly on top of RSI Simple APIs without custom harness glue code.
3. Provide complete protocol documentation (RFC draft or SDK specification), type definitions, and end-to-end automated tests."
    description_zh: "在 PenguinHarness 中设计并实现标准化的 **RSI Simple APIs** 协议与轻量 SDK，将「RSI 进化算法」与底层的「Agent 框架、评测基准、可进化状态（Prompt / Skill / Memory / 代码 / 权重）」彻底解耦，提供像搭积木一样编写和组合 RSI 算法的统一原语。

交付与验收要求：
1. 定义清晰、正交的 RSI Simple APIs 协议规范与 SDK 接口，标准化三大核心原语：
   - **采样（`sample` / `rollout`）**：给定版本化的候选状态节点（State Node）与任务输入，支持并行执行多路 Agent 轨迹采样或生成候选变更（覆盖系统提示词、Skill、Memory Playbook、Harness 工具代码或模型参数）。
   - **评估与复核（`evaluate` / `verify`）**：对接隔离的 Benchmark Evaluator 与防作弊 Reviewer，返回统一结构的标量得分、置信/噪声区间、完整执行 Trace 与失败归因诊断。
   - **更新与演进（`update` / `commit`）**：根据评估反馈对候选树（Candidate Tree）与经验库（Experience Bank）执行状态转移、分支回滚或合并提交，输出新一代 Agent State。
2. 基于 RSI Simple APIs 重构或实现至少两种不同范式的 RSI 算法（如 ACE、OPRO、Reflexion 或 ERNIE Evolve 双层研究线搜索），验证无需重复编写底层胶水代码即可跨 Benchmark 运行。
3. 提供完整的协议规范文档（可同步沉淀为社区 RFC）、类型定义与端到端测试。"
