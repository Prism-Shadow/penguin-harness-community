    title: "After the Riemann Hypothesis, Try These? 50 Hard Lean Problems Selected from Public Evaluations"
    title_zh: "黎曼猜想之后，试试这些问题？｜从公开评测中精选 50 道 Lean 难题"
    description: "On November 20, Levent Alpöge of Anthropic released a Lean proof of the Riemann Hypothesis. The proof runs to about 17 million lines and was written with the help of Claude. The next day, the Lean and Mathlib communities issued a joint statement saying they have full confidence that the proof is correct. Nobody can read a proof that long from start to finish. The community's confidence comes from Lean itself. The proof targets the Riemann Hypothesis statement that has long been in Mathlib, and it passed the Lean kernel and several independent checkers. [Lean community statement](https://leanprover-community.github.io/blog/posts/riemann-hypothesis/) · [AP report](https://apnews.com/article/4fe8b69a891f160f9e7f0c85af8c55c8)

The same kind of check shows how well AI proves theorems in everyday use. MathArena builds each round of problems from theorems in new arXiv papers. In the September round, GPT-6.2 Astra proved 42 of 53, and no model proved the other 10. Epoch AI's FrontierMath Erdős contains 68 Erdős problems, and the best model, GPT-6.2 Astra, solved only 7. We picked the 50 hardest problems from these benchmarks to see whose Agent Harness can prove more of them after self-improvement. Grading follows the same rule as the Riemann Hypothesis proof. The theorem statement may not change, no axioms may be added, and a problem counts only when Lean accepts the proof. [MathArena ArXivLean](https://matharena.ai/?comp=arxivlean--september) · [FrontierMath Erdős](https://epoch.ai/benchmarks/frontiermath-erdos)

We selected problems from published per-attempt records, using only benchmarks that also publish failures. MathArena's three ArXivLean rounds contain 140 problems with results from 10 to 14 models each. Epoch's OEIS Open Lite has 100 OEIS conjectures with 14 to 15 runs each, plus 4 runs on the full set. FrontierMath Erdős has official runs for 16 models. Each selected problem has at least 10 attempts by models from at least 3 vendors and was solved in at most 20% of them. Some system has proved 39 of them, but each was solved only one to three times, so they are provable but hard. No system has solved the other 11 in the public records, and published proofs settle their truth. We removed duplicate versions of the same conjecture, problems whose statements changed during evaluation, and problems that were disproved because the formalization itself was wrong. [ArXivLean results](https://matharena.ai/?comp=arxivlean--september) · [OEIS Open runs](https://github.com/epoch-research/LeanOpenProblems-results/tree/cbb7cb657f24157d9ebb7640ec50bd35bad78ad8) · [FrontierMath Erdős data](https://epoch.ai/data/benchmark_data.zip)

#### How to participate

Comment `/claim` here and register your model version, harness and planned self-improvement method in the target repository. The problems, fixed split, environment scripts and grader are in the [problem package](https://github.com/Yu-Yang-Li/formal-hard-50/tree/0d1fc406f87741d86b5b6b2b897cc97377a80173). The 50 problems are split into 25 Train and 25 Test problems, and both sets contain problems some system has proved and problems no system has proved. Improve your skill or strategy with compiler and grader feedback on Train, then freeze it.

Run the original harness and the frozen harness three times each on the same 25 Test problems. Keep the model version, tool access, `high` reasoning effort, per-problem budget and grading identical. Agents may use the Lean compiler and Mathlib search but must not search the web, since the problems come from public papers and accepted Lean proofs for 32 of them are available online. Grade each problem with `eval/check.py` from the package, which runs Comparator in the original Lean version. Before release we checked this grader against 9 accepted public proofs and 5 cheating submissions, and every result matched expectations. For each run, report how many of the 25 problems were proved or correctly disproved, and record compilation failures, timeouts and grading failures separately.

Save outputs and grades by problem and run so an interrupted run can resume from the missing records. Link a PR with per-problem results, the problems that changed from unproved to proved, changes to the skill or strategy, reproduction steps, and the time, tokens and cost of improvement and evaluation separately. This is a recurring task, and each accepted independent evaluation earns **200 EXP**. [Evaluation workflow](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/workflow/evaluation.zh.md)"
    description_zh: "11 月 20 日，Anthropic 的 Levent Alpöge 公开了一份黎曼猜想的 Lean 证明。整份证明约 1,700 万行，是借助 Claude 写成的。第二天，Lean 和 Mathlib 社区发表联合声明，说他们完全相信这份证明是正确的。这么长的证明没人能从头读完，社区的底气来自 Lean 本身。它证的是 Mathlib 里早就写好的黎曼猜想陈述，Lean 内核和几个独立的检查器也都通过了。[Lean 社区声明](https://leanprover-community.github.io/blog/posts/riemann-hypothesis/) · [AP 报道](https://apnews.com/article/4fe8b69a891f160f9e7f0c85af8c55c8)

同样的检查办法，也能用来看 AI 平时的证明水平。MathArena 每期从 arXiv 新论文里选定理出题。9 月那期共 53 道，GPT-6.2 Astra 证出 42 道，另有 10 道所有模型都没证出来。Epoch AI 的 FrontierMath Erdős 收了 68 个 Erdős 问题，表现最好的 GPT-6.2 Astra 也只解出 7 个。我们从这些题库里挑出最难的 50 道，比一比谁的 Agent Harness 自进化以后能多证出几道。判分标准和黎曼猜想那份证明一样，不许改定理陈述，不许加公理，Lean 编译通过才算证出。[MathArena ArXivLean](https://matharena.ai/?comp=arxivlean--september) · [FrontierMath Erdős](https://epoch.ai/benchmarks/frontiermath-erdos)

我们按别人公开的逐次作答记录筛题，只用同时公开了失败记录的题库。MathArena 三期 ArXivLean 共 140 道题，每道有 10 到 14 个模型的结果。Epoch 的 OEIS Open 精简版有 100 个 OEIS 猜想，每道有 14 到 15 组运行，另有完整版的 4 组运行。FrontierMath Erdős 有 16 个模型的正式评测。入选的题至少有 10 次作答，来自至少 3 家厂商的模型，解出的次数不超过 20%。其中 39 道已经有系统证出，但每道只成功过 1 到 3 次，说明题能证，只是很难证。另外 11 道在公开记录里没有任何系统解出，命题真假已由论文证明。我们去掉了同一猜想的重复版本、评测期间陈述改过的题，以及被否证、说明形式化本身写错的题。[ArXivLean 逐题结果](https://matharena.ai/?comp=arxivlean--september) · [OEIS Open 运行记录](https://github.com/epoch-research/LeanOpenProblems-results/tree/cbb7cb657f24157d9ebb7640ec50bd35bad78ad8) · [FrontierMath Erdős 数据](https://epoch.ai/data/benchmark_data.zip)

#### 怎么参加

在本任务下评论 `/claim`，在目标仓库登记模型版本、Harness 和打算尝试的自进化方法。题目、固定分组、环境与判分脚本都在[题包仓库](https://github.com/Yu-Yang-Li/formal-hard-50/tree/0d1fc406f87741d86b5b6b2b897cc97377a80173)里。50 道题固定分为 25 道 Train 和 25 道 Test，两组都包含已有系统证出的题和尚无系统证出的题。用 Train 的编译和判分反馈改 Skill 或策略，选定后冻结。

初版 Harness 和冻结版都在同一组 25 道 Test 上各跑 3 次。使用相同模型版本、工具权限、`high` 思考强度、单题预算和判分规则。作答时可以调用 Lean 编译和 Mathlib 检索，但要关闭联网搜索，因为这些题出自公开论文，其中 32 道还能在网上找到别人交过的通过证明。每题用题包里的 `eval/check.py` 判分，它按原来源的 Lean 版本调用 Comparator。发布前我们用别人公开的 9 份通过证明和 5 份作弊提交检查过这套判分，结果都符合预期。每轮报 25 道里证出或正确否证了几道，编译失败、超时和判分失败分开记录。

