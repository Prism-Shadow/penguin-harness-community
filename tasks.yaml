  - id: "RSI-Q044"
    issue_number: 91
    published_at: "2026-11-16T09:57:31Z"
    status: "open"
    domain: "PenguinHarness"
    exp: 150
    target_repository: "https://github.com/Prism-Shadow/penguin-harness-plugins"
    related_issue: null
    title: "Integrate Obelisk Raw-History Retrieval Layer & Stratified Graph View Memory Architecture into PenguinHarness"
    title_zh: "在 PenguinHarness 中集成 Obelisk 原始历史检索层与分层 Graph View 记忆基础设施"
    description: "Design and integrate a first-principles, two-stage Agent Memory infrastructure for PenguinHarness based on Obelisk (https://github.com/tommy0103/obelisk) and Nowledge Mem Super Graph (https://mem.nowledge.co):

Stage 1 — Lossless Raw-History Retrieval Layer (Obelisk Pattern):
- Treat time as the natural scale and index raw agent session transcripts, messages, and tool workflows across PenguinHarness and external harnesses (Claude Code, Codex, Copilot, Kiro, OpenCode, Kimi Code, DeepSeek Harness, etc.) into SQLite + FTS5.
- Expose a lightweight JS Query Runtime (CodeAct Skill) instead of rigid static summaries or narrow query APIs, enabling the agent to write and execute on-the-fly JS query scripts over raw history for provenance Q&A (\"why did we write it this way last time?\") and citation-backed cross-month retrospectives.

Stage 2 — Stratified Graph View Layer (Nowledge Mem Super Graph Pattern):
- Scale beyond single-turn FTS limits by maintaining a Graph View above the Obelisk raw history layer: let the agent first inspect the global knowledge distribution and completeness with ~38% lower token consumption before spending deep reasoning budget, while retaining direct drill-down pointers back to raw Obelisk history.
- Implement time-frequency stratified live-updates (where new conclusions locally update stratified temporal views rather than destructively overwriting prior history) so long-horizon research understanding lives outside the context window without expiring or causing negative memory tax."
    description_zh: "基于第一性原理，在 PenguinHarness 中集成由「Obelisk 原始历史检索层」与「Nowledge Mem Super Graph 分层图视图」组成的双层 Agent Memory 基础设施：

第一层：克制的无损原始历史检索层（Obelisk 模式）
- 以时间为自然标度，保留追溯回原始历史的完整路径（原文绝不丢弃），接入 PenguinHarness 及主流 Harness（Claude Code、Codex、GitHub Copilot、Kiro、OpenCode、Kimi Code、DeepSeek Harness 等）的原始会话历史。
- 采用 SQLite + FTS5 + JS Query Runtime（CodeAct Skill）架构：不把历史压成损失细节的静态摘要，也不限制死板的查询 API，而是以 Skill 为载体让 Agent 现场编写 JS 查询脚本检索原始历史，直接支撑“上次为什么这么改”的溯源研究与每条结论均精确到 session / message / workflow 的跨整月自主复盘。

第二层：面向规模化长程研究的 Graph View 层（Nowledge Mem Super Graph 模式）
- 在 Obelisk 原始历史检索层之上维护一层 Graph View：让 Agent 先看到全局信息分布与完备度、节省约 38% 的读取 Token 预算，需要细节时随时顺着指针下钻回 Obelisk 原始历史。
- 实现按时间频率分层的 Live-Update 机制（新结论局部增量更新、不直接覆盖旧结论），让长程研究理解存活在上下文窗口之外，彻底解决长程 Research 的 Context Rot 且保证零负收益（no negative effect）。"
    references:
      - "https://github.com/tommy0103/obelisk"
      - "https://mem.nowledge.co"
      - "https://github.com/tommy0103/talks/tree/main/2026-11-15-coscon26-magic"
      - "https://arxiv.org/abs/2610.30755"
