  - id: "RSI-Q032"
    issue_number: 75
    published_at: "2026-11-13T07:55:55Z"
    status: "open"
    domain: "Evaluation"
    exp: 50
    target_repository: "https://github.com/Prism-Shadow/penguin-harness-benchmark"
    recurring: true
    related_issue: "https://github.com/Prism-Shadow/penguin-harness-benchmark/issues/26"
    title: "Humanity’s Last Exam (Diamond) Scientific Reasoning Challenge: 50 Hard Questions Selected from Public Evaluations"
    title_zh: "Humanity’s Last Exam（Diamond）科学推理挑战｜从公开评测中精选 50 道难题"
    description: "Humanity’s Last Exam (HLE), launched by the Center for AI Safety (CAIS) and Scale AI, tests whether frontier AI models can apply specialist knowledge to difficult academic questions. Nearly 1,000 subject-matter experts from more than 500 institutions in 50 countries contributed to the benchmark. The public set described in Nature contains 2,500 questions spanning more than 100 subjects, including mathematics, the natural sciences, and the humanities. The questions underwent two rounds of review, with reference answers and solutions provided for grading the final response. [HLE paper](https://www.nature.com/articles/s41586-025-09962-4)

We invite community members to evaluate their RSI methods on these 50 questions and compare how much their systems improve. Each participant submits scores before and after self-improvement, per-question results, and a description of their method. Results will be grouped by base model and evaluation conditions, showing final scores, score gains, time, and token use, and collected in a public leaderboard. This complements Terminal-Bench-Science, which focuses on scientific workflows.

We reviewed release materials for leading models from ten providers; materials from six of them listed HLE-family scores. We also compared the original HLE, the rolling release, and HLE-Diamond, and consulted the HLE-Verified and FutureHouse reviews of the original questions and answers. We chose a fixed HLE-Diamond release, which contains 500 reasoning questions and 500 knowledge questions. For the first round, we selected 50 of the 500 reasoning questions with low pass rates in published evaluations and fixed the set for repeated comparisons before and after self-improvement. [HLE-Diamond release](https://lastexam.ai/blog/hle-diamond) · [HLE-Verified](https://arxiv.org/html/2602.13964) · [FutureHouse](https://www.futurehouse.org/research/hle-exam)

We checked all 500 reasoning questions against published results from JiSi, SALT, FUSE, and other teams and found usable responses for 162. We selected questions that models struggled with across independent evaluations. For each selected question, the models we compared averaged at most 20% accuracy in at least two independent studies, with wrong answers from at least three model providers across those studies. On one math question, for example, GPT-5.5, GPT-5.4, and Grok 4.20 NR each scored 0 out of 20 in SALT’s experiment. We prioritized questions with repeated low scores, checked the wording and reference answers, and removed duplicates and items with unresolved grading issues. For 17 of the final 50 questions, at least one model made three or more attempts in a single study and scored at most 20%. All 50 are text-only. Most cover mathematics, the natural sciences, computer science, and engineering, with some in the humanities, social sciences, and logic. [JiSi results](https://huggingface.co/datasets/aisfuture/jisi_data/tree/0080d2ea1119f177fed0c158cb02b25636b3ff33/benchmark_bank/hle/test) · [SALT experiments](https://huggingface.co/collections/SALT-NLP/context-induced-instability) · [FUSE records](https://huggingface.co/datasets/FUSE-verifiers/HLE-Verifications)

#### Participation and results

1. Each claim covers one evaluation experiment. First register the model and exact version, Harness, RSI method, tool permissions, and resource budgets in the target repository, and describe the planned comparison. Participants can submit their own methods and results.
2. Evaluate the system before and after self-improvement on the same 50 questions. Keep the model, tool permissions, evaluation budget, and grading method fixed for the two evaluations. Use separate questions for development and record the data and resources used during self-improvement. Three repeated evaluations are recommended, with the mean score and variation reported.
3. Submit total scores before and after self-improvement, score gains, and per-question results, including answers that changed from wrong to correct or correct to wrong. Report token use, time, and cost. Record incorrect answers, execution failures, and grading failures separately, and provide rerun instructions and complete experiment records.
4. Submit the configuration and results under RFC-0002, with status set to draft in meta_info.yaml, and link the PR to this task. Reviewed results will be grouped by base model and evaluation conditions, showing both final scores and gains over the starting system. [Evaluation workflow](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/workflow/evaluation.md) · [Leaderboard specification](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/rfcs/RFC-0005-leaderboard.md)

The challenge uses a fixed question set and a shared grading method. Dataset integration and grading setup are tracked in [Benchmark issue #26](https://github.com/Prism-Shadow/penguin-harness-benchmark/issues/26).

#### Fixed selection and evidence

[Versioned selection files and per-question public evaluation records](https://gist.github.com/Yu-Yang-Li/df9e59e22157a1da35e2c22cc9c15f35/af657dfccf60a5039f9c40bad11d5e4d128be603) include all 50 official IDs, the pinned dataset revision, model-level results, source links, and checksums."
    description_zh: "Humanity's Last Exam（HLE）由 Center for AI Safety（CAIS）和 Scale AI 发起，用来评估前沿 AI 模型运用专业知识解答高难度学术问题的能力。参与出题的近 1,000 位学科专家来自 50 个国家的 500 多家机构。《Nature》论文所述公开集共 2,500 道题，覆盖数学、自然科学和人文等 100 多个细分学科。题目经过两阶段审阅，每道都附参考答案与解题说明，评分以最终作答为准。 [HLE 论文](https://www.nature.com/articles/s41586-025-09962-4) · [项目发起说明](https://scale.com/blog/humanitys-last-exam)

我们提供这 50 道题，邀请社区成员用各自的 RSI 方法参与评测，看看谁的进化效果更好。每位参与者提交进化前后的成绩、逐题结果和方法说明。结果按基座模型和评测条件分组，比较进化后的得分、提升幅度，以及消耗的时间和 Token，并逐步汇总成公开榜单。社区已有的 Terminal-Bench-Science 侧重科研工作流，HLE 可以补上一组跨学科、能逐题判分的推理任务。

我们查了十家厂商的主力模型发布材料，其中六家列出了 HLE 系列评测成绩。我们还比较了原版 HLE、持续更新的 HLE-Rolling 和 HLE-Diamond，也参考了 HLE-Verified 和 FutureHouse 对原版题目及答案的核查。最终选用固定版本的 HLE-Diamond。这是官方修订的 1,000 道题，推理和知识各占一半。首轮从 500 道推理题中筛出 50 道在公开评测中通过率较低的题，固定题单，用于多轮自进化前后对照。 [HLE-Diamond 发布说明](https://lastexam.ai/blog/hle-diamond) · [HLE-Verified](https://arxiv.org/html/2602.13964) · [FutureHouse](https://www.futurehouse.org/research/hle-exam)

我们把 500 道推理题和集思谱、SALT、FUSE 等团队的公开记录逐题比对，其中 162 道找到了可核对的有效作答。我们挑的是在不同团队的评测里都让模型失分的题。每道入选题都有至少两组独立实验的记录。参与比较的模型在每组实验中的平均答对率都不超过 20%，合计至少有三家厂商的模型答错。比如有一道数学题，GPT-5.5、GPT-5.4 和 Grok 4.20 NR 在 SALT 的实验里各答了 20 次，一次也没答对。我们优先选有重复低分记录的题，再核对题面和参考答案，剔除重复题及有计分争议的题。最终 50 道里，有 17 道至少有一款模型在同一实验中答了三次或以上，答对率仍不超过 20%。这 50 道都是文本题，以数学、自然科学、计算机和工程为主，也涵盖人文社科与逻辑。 [集思谱逐题记录](https://huggingface.co/datasets/aisfuture/jisi_data/tree/0080d2ea1119f177fed0c158cb02b25636b3ff33/benchmark_bank/hle/test) · [SALT 逐题实验](https://huggingface.co/collections/SALT-NLP/context-induced-instability) · [FUSE 作答与判分记录](https://huggingface.co/datasets/FUSE-verifiers/HLE-Verifications)

#### 参与方式与结果提交

1. 每次认领对应一组评测实验。先在目标仓库登记所用模型及版本、Harness、RSI 方法、工具权限和资源预算，说明准备比较的方案。不同参与者可以提交各自的方法和结果。
2. 在这 50 道题上分别评测进化前、进化后的系统，保持两次评测的模型、工具权限、预算和评分方式一致。开发和调试使用另外的题目，记录进化阶段使用的数据与资源。建议重复评测 3 次，报告平均成绩和波动。
3. 提交进化前后的总分、提升幅度和逐题结果，说明哪些题由错变对、哪些由对变错，同时记录 Token、耗时和费用。答错、运行失败和评分失败分别记录，并提供复跑方法与完整实验记录。
4. 按 RFC-0002 整理实验配置和结果，将 meta_info.yaml 的 status 设为 draft，提交 PR 并关联本任务。通过审核的结果按相同基座模型和评测条件分组汇总，同时展示进化后的成绩和相对进化前的提升。 [Evaluation 提交流程](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/workflow/evaluation.zh.md) · [榜单规范](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/rfcs/RFC-0005-leaderboard.zh.md)

评测使用固定题单和统一评分方式。题集接入与评分准备由[关联的 Benchmark 登记 #26](https://github.com/Prism-Shadow/penguin-harness-benchmark/issues/26)跟进。

