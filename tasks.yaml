    title: "Integrate AutoResearch Infra-Only Benchmark"
    title_zh: "集成 AutoResearch 训练基础设施优化基准"
    description: "Integrate a fixed-step AutoResearch benchmark for training infrastructure optimization into `penguin-harness-benchmark`. Use the fixed-step AutoResearch workload and reproducibility materials from [PenguinHarness PR #1551](https://github.com/Prism-Shadow/penguin-harness/pull/1551#issuecomment-6997394473) as the starting point. The benchmark should be reusable by InfraRSI and other methods. Track the related full-stack AutoResearch effort in [#83](https://github.com/Prism-Shadow/penguin-harness-community/issues/83) and share preparation or baseline components where practical.

#### Deliverables and acceptance criteria

1. Package the benchmark under [RFC-0001](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/rfcs/RFC-0001-benchmark.md) with task metadata, a reproducible baseline, and documented setup and execution commands. Pin the upstream code and dependency versions, data splits, and tokenizer. Submit the benchmark as `draft`.
2. Define and enforce a fixed-workload contract. Keep the model architecture, data and tokenizer, optimizer and schedule, global batch, and number of optimizer updates fixed for all candidates. Permit infrastructure choices such as micro-batch size with equivalent gradient accumulation, compiler settings, and equivalent training-code or kernel changes. Document the editable scope and numerical tolerance.
3. Provide baseline and candidate execution and an evaluator that checks the training contract and validation quality. Record elapsed time for the fixed workload with startup and compilation accounted for, along with steady-state step time or throughput and validation `val_bpb`. Verify the setup and scoring end to end with a reproducible run."
    description_zh: "将 AutoResearch 固定步数的训练基础设施优化基准接入 `penguin-harness-benchmark`。以 [PenguinHarness PR #1551](https://github.com/Prism-Shadow/penguin-harness/pull/1551#issuecomment-6997394473) 中的训练负载和复现材料为起点，供 InfraRSI 及其他方法复用。全栈 AutoResearch 接入见 [#83](https://github.com/Prism-Shadow/penguin-harness-community/issues/83)，可共用的数据准备与基线组件尽量复用。

