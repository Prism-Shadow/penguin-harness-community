  - id: "RSI-Q043"
    issue_number: 90
    published_at: "2026-11-16T09:57:23Z"
    status: "open"
    domain: "Benchmark"
    exp: 100
    target_repository: "https://github.com/Prism-Shadow/penguin-harness-benchmark"
    related_issue: null
    title: "Build and Integrate a First-Principles Agent Memory Benchmark (Raw-History Retrieval, Provenance Research & Memory Tax Evaluation)"
    title_zh: "构建与集成 Agent Memory 第一性原理评测基准（原始历史检索、跨会话溯源研究与 Memory Tax 净收益评测）"
    description: "Recent studies on Agent Memory (arXiv:2610.30755, \"Memory Tax / Context as Infrastructure\") established three counter-intuitive findings:
1. Recall is a victory of the Bitter Lesson: naive retrieval directly over raw history ranked #1 on 6 out of 7 benchmarks.
2. Complex memory pipelines that compress raw history into summaries or atomic facts often yield negative net value compared to naive RAG plus one additional retrieval turn.
3. A harness equipped only with BM25 and grep matches classical memory architectures in accuracy.

Build and integrate an Agent Memory benchmark suite in penguin-harness-benchmark grounded in first principles:
1. Include standardized long-horizon conversational/coding memory benchmarks alongside multi-session agent history provenance & autonomous retrospective tasks (e.g., querying across weeks of real coding agent sessions: \"which files were changed to fix the last auth bug and why?\", or generating a month-long development retrospective where every claim cites exact session, message, and workflow IDs).
2. Evaluate every memory system against a mandatory Raw-History Baseline (BM25 / FTS5 / grep over lossless session transcripts) to explicitly measure \"Memory Tax\" and Net Value:
   - Recall & Provenance Citation Accuracy (verify zero negative effect compared to raw history).
   - Token & Reasoning Budget Efficiency (measuring whether higher-level views such as graph views reduce read tokens, e.g., -38% token cost, while preserving drill-down fidelity to raw history).
   - Resistance to Context Rot under temporal updates (verifying that newer findings update local temporal layers without destructively overwriting historical facts)."
    description_zh: "近期关于 Agent Memory 的研究（arXiv:2610.30755 / Memory Tax / Context as Infrastructure）验证了三个反直觉的事实：
1. 在召回率上，是 The Bitter Lesson 的胜利：原始历史上的朴素检索在 7 组 benchmark 里拿了 6 个第一；
2. 把原文抽成摘要或原子事实的复杂 Memory 系统，往往带来负收益（negative net value），表现还不如朴素 RAG 追加一轮检索；
3. 只用 BM25 和 grep 的 harness 与经典 memory 结构无明显准确率差异。

本任务旨在 penguin-harness-benchmark 中构建并集成一套从第一性原理出发的 Agent Memory 评测基准：
1. 融合长程记忆基准与真实跨会话 Agent 历史溯源研究（Agentic Research）任务：评测智能体在数周至整月的真实开发历史（覆盖多 session、message、tool workflow）中回答代码演进动因（如“上次某 bug 最终改了哪些文件、为什么这么改”）以及生成每条结论均精确关联出处（session / message / workflow）的跨月度自主复盘能力。
2. 强制设立「无损原始历史朴素检索基线」（基于原文的 BM25 / SQLite FTS5 / grep），显式量化任何被测记忆系统的 **Memory Tax（记忆税 / 净收益）**：
   - 召回率与出处溯源准确率（检验是否存在丢失原文导致的负收益，确保 no negative effect）；
   - Token 与推理预算效率（检验在原始历史之上构建的 Graph View 是否能显著降低读取 Token 开销，如减少 30%+ Token，同时随时可下钻回溯原始历史）；
   - 随时间演进的抗 Context Rot 能力（检验多轮增量信息写入时，按时间频率分层的局部 live-update 能否避免新结论直接覆盖旧结论导致的记忆过期）。"
    references:
      - "https://arxiv.org/abs/2610.30755"
      - "https://github.com/tommy0103/obelisk"
      - "https://mem.nowledge.co"
      - "https://github.com/tommy0103/talks/tree/main/2026-11-15-coscon26-magic"
