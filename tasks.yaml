    title: "Advance PenguinHarness Agent Company (Company Mode) & Super Agent Architecture"
    title_zh: "持续优化 PenguinHarness Agent 公司（Company Mode）与 Super Agent 协同进化架构"
    description: "Advance the Agent Company (Company Mode) and Super Agent architecture in PenguinHarness to support autonomous long-horizon planning, multi-role organization orchestration, and collective self-evolution.

Deliverables and acceptance criteria:
1. Super Agent Orchestration & Delegation: enhance how the lead Super Agent decomposes open-ended goals into verifiable milestones, dispatches specialized sub-agents/departments in parallel, and arbitrates conflicting proposals or blockers without flooding communication channels.
2. Shared Workspace, Memory & Artifact Handoff: standardize structured deliverables, acceptance contracts, and cross-agent memory indexing so downstream agents inherit verified context with minimal token overhead.
3. Organization-Level RSI: allow the Agent Company to retrospectively audit completed projects (identifying bottlenecks, rework loops, and failure modes) and automatically update role prompts, skills, and collaboration SOPs."
    description_zh: "在 Harness 层持续深耕并优化 PenguinHarness 的「Agent 公司（Company Mode）」与「Super Agent」架构，提升长程复杂工程与科研任务中的多智能体组织协同效率与集体自进化能力。

交付与验收要求：
1. Super Agent 统筹与动态委派：强化主控 Super Agent 对复杂目标的里程碑拆解、跨职能子智能体并行调度、阻塞诊断与冲突仲裁机制，保持频道沟通精炼高效。
2. 结构化产物交接与共享记忆：规范跨角色任务契约（输入/输出产物、验收标准）与共享记忆索引，使上下游 Agent 以最小 Token 开销继承经验证的上下文。
3. 组织级自进化（Organizational RSI）：支持 Agent 公司在项目完成后自动复盘流程瓶颈、返工原因与失败模式，并迭代更新各岗位 Prompt、Skill 与协作 SOP。"
