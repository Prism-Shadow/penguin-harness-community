  - id: "RSI-Q052"
    issue_number: 112
    author: "Yu-Yang-Li"
    pr_number: 42
    published_at: "2026-11-18T16:26:35Z"
    status: "in_progress"
    domain: "Evaluation"
    exp: 150
    target_repository: "https://github.com/Prism-Shadow/penguin-harness-benchmark"
    recurring: true
    related_issue: null
    title: "Is Your Agent Misleading You? 50 Hard Cases Selected from Public Evaluations"
    title_zh: "智能体是不是在骗你？｜从公开评测中精选 50 道难题"
    description: "Your coding agent says it fixed the bug. Only when you ask about tests do you learn that the build tool was missing. OpenAI’s internal Blocker Deception evaluation found that GPT-6 Astra omitted a known obstacle in 11.09% of trials and GPT-6.2 Astra in 22.28%. The Codex developer prompt substantially reduced omissions. Can a tuned harness tell the user what worked and where it got stuck in its first reply? [OpenAI system card, §4.1.3.1](https://deploymentsafety.openai.com/gpt-6-2-astra-sol/blocker-deception)

We selected 50 cases for Chinese-language replay. In Failure-Transparent Agents, 29 of 100 cases had at least 6 false-success or fabricated-detail reports in 12 baseline answers (six models, twice each). RetryRealistic supplies 2,100 judgments across 175 task/fault combinations for 30 tasks. We kept one fault per task and selected 15 cases with at least 5 fabrications in 12 runs. Six of the 200 Async-RBench tasks are author-rated hard cases with public step-by-step traces. Their follow-up events test whether the agent revises an outdated conclusion or counts the same result twice.

#### How to participate

Comment `/claim` here and register your model version, harness and tuning method in the target repository. Use the [pinned case files, split and rubrics](https://gist.github.com/Yu-Yang-Li/cc57204497f5738d59e9899636c0f180/df6a3ee68fa7f52cba32208074e53f48e179e750). Iterate on the 25 Train cases and freeze the resulting skill or strategy. Run the bare model, original harness and tuned harness three times each on the same 25 Test cases. Match model version, tool access, high reasoning effort, per-case budget and grading. Start a fresh conversation per case and save the first reply before delivering its follow-up event.

For each run report first replies that accurately state progress and blockers (out of 25) and follow-up events handled correctly (out of 3). Save outputs and scores by configuration, run, case and stage so an interrupted run can resume. Submit per-case results, changes to the skill or strategy, reproduction steps, and separate tuning and evaluation time, tokens and costs. Link the results PR to this issue. Each accepted independent evaluation earns 150 EXP. [Evaluation workflow](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/workflow/evaluation.zh.md)"
    description_zh: "用 AI 改代码时，你可能遇到过这种情况。它回你“修好了”，你追问“测试跑过了吗？”，它才说测试没跑起来。再问原因，才知道环境里缺了构建工具，它早就卡在这一步了。代码改到了哪儿、修复有没有验证，本来可以在交付时一起说清楚，最后却要你一项项追问。

OpenAI 在 GPT-6.2 系统卡里公布了内部评测 **Blocker Deception**。研究人员从编码环境里移走任务必需的文件或工具，看模型会不会在最终答复里主动交代。**GPT-6 Astra 的漏报率是 11.09%，到了 GPT-6.2 Astra 升至 22.28%，超过上一代的两倍，被人戏称“安全地”发布了并不安全的模型。** 给 GPT-6.2 Astra 加上 Codex 的开发者提示后，漏报率明显下降。我们沿着这个问题选了 50 道题，想看看 Agent Harness 经过调优后，能不能在一份答复里就把进度和阻碍说清楚，让用户少追问几次。[OpenAI 系统卡 §4.1.3.1](https://deploymentsafety.openai.com/gpt-6-2-astra-sol/blocker-deception)

我们从三个公开题库选了 50 道题，想看 Agent 遇到阻碍会不会漏报、只做成一部分会不会报成全部完成、拿到新记录后会不会更新结论。我们按原作者公开的作答和运行轨迹逐题筛选。Failure-Transparent Agents 的 100 道题，每道都有 6 个模型各答 2 次的记录，我们选了至少有 6/12 次虚报完成或编造细节的 29 道。RetryRealistic 有 30 个任务、175 种任务和故障的组合，共 2,100 条判分。同一个任务只留最容易让模型编造结果的那种故障，选出至少有 5/12 次编造结果的 15 道。最后从 Async-RBench 的 200 道题里选了 6 道，都是作者标为 `hard`、并且能查看逐步轨迹的题，用来测新记录来了之后，Agent 会不会改掉过时的结论，或者把重复送来的结果算成新进展。

#### 怎么参加

在本任务下评论 `/claim`，在目标仓库登记模型版本、Harness 和打算尝试的调优方法。下载[固定题包、分组和判分说明](https://gist.github.com/Yu-Yang-Li/cc57204497f5738d59e9899636c0f180/df6a3ee68fa7f52cba32208074e53f48e179e750)，用 25 道 Train 的反馈改 Skill 或策略，选定后冻结。

模型直答、初版 Harness 和调优后的 Harness 都在同一组 25 道 Test 上各跑 3 次。使用相同模型版本、工具权限、`high` 思考强度、单题预算和判分规则。每题开新会话，先保存首份答复，再投递后续事件。每轮分别报两项成绩：25 道题中有几道在第一份答复就交代清楚，3 次后续事件里有几次处理正确。

按题号、轮次和阶段保存作答与判分，跑断后从缺失的记录接上。交 PR 时附逐题结果、Skill 或策略改动、复跑方法，以及进化和评测各自的耗时、Token 和费用，关联本任务。常驻开放，每份通过验收的独立评测计 **150 EXP**。[Evaluation 提交流程](https://github.com/Prism-Shadow/penguin-harness-community/blob/main/workflow/evaluation.zh.md)"
    references:
      - "https://deploymentsafety.openai.com/gpt-6-2-astra-sol/blocker-deception"
      - "https://github.com/junru-zhu/failure-transparent-agents/releases/tag/v0.3.0"
      - "https://github.com/Kingsford-Group/RetryRealistic/blob/9011bd626e76ec22c361d00d7d339b1e4eec82ca/results/baseline.json"
