    description: "Use fixed historical market data to rerun a rule, compare it with a benchmark, and export a verifiable research report.

**Deliverables and acceptance criteria**

1. Import historical prices with their source and cutoff date. Configure the backtest interval, moving-average periods, fill timing after signal confirmation, and transaction cost assumptions.
2. Compare the strategy and benchmark on matching data, intervals, and initial capital. Report signals, simulated fills, equity curves, cumulative return, and maximum drawdown. Each fill traces to a market observation after its signal.
3. Reproduce the two-moving-average case in DSH Chapter 10. Provide the fixed input data or version, parameters, expected results, and report so reviewers can independently verify key dates and metrics.
4. Submit the implementation to `penguin-harness-apps` and the registration PR to `penguin-harness-plugins`. Link the implementation PR, reproduction steps, and acceptance evidence from the registration PR. Verify that the installed workbench can be added to an Agent and opened from the App Center."
