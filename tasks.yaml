  - id: "RSI-Q038"
    issue_number: 86
    author: "hiyouga"
    published_at: "2026-11-16T09:57:10Z"
    status: "in_progress"
    domain: "RSI Algorithm"
    exp: 150
    target_repository: "https://github.com/Prism-Shadow/penguin-harness-plugins"
    related_issue: null
    title: "Reproduce ERNIE Evolve Dual-Loop Automated Research System in PenguinHarness"
    title_zh: "在 PenguinHarness 中复现 ERNIE Evolve 双层循环自动研究系统"
    description: "Reproduce the ERNIE Evolve automated research architecture in PenguinHarness as a reusable RSI plugin/workflow, and validate it on the integrated public AI R&D benchmarks (NanoChat AutoResearch, NanoGPT Speedrun, and SOL-ExecBench).

Deliverables and acceptance criteria:
1. Implement the ERNIE Evolve dual-loop multi-agent architecture in PenguinHarness:
   - Outer loop (`Director` + `Experience Bank` + `Knowledge Base`): proposes high-value research directions, selects starting checkpoints (baseline, best candidate, intermediate node, or upstream main), and manages parallel research lanes (`lanes`), each maintaining its own candidate tree.
   - Inner loop (`Selector` + `Executor` + `Evaluator` + `Reviewer`): selects nodes along a research lane, formulates concrete hypotheses, executes code changes in an isolated environment, runs the immutable external `Evaluator` (accepting only gains above the noise threshold), and audits diffs with `Reviewer` to reject off-direction changes or evaluation-loophole exploits (reward hacking).
2. Ensure failed attempts, root-cause diagnostics, and verified improvements flow back into the Experience Bank to guide subsequent outer/inner loop decisions.
3. Demonstrate end-to-end automated research runs in PenguinHarness on at least one of NanoChat AutoResearch, NanoGPT Speedrun, or SOL-ExecBench with reproducible logs, candidate trees, and verified metric gains over baseline."
    description_zh: "在 PenguinHarness 中复现百度 ERNIE Evolve 双层循环自动研究系统，封装为可复用的 RSI 插件/工作流，并在公开 AI 研发任务（NanoChat AutoResearch、NanoGPT Speedrun、SOL-ExecBench）上完成实验验证。

交付与验收要求：
