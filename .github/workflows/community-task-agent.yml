name: Community Task Steward Agent

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - "community/tasks.yaml"
      - "community/people.yaml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  steward-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit concurrent claim caps & cross-repo PR statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/community-agent-sync.mjs
